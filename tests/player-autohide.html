<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Player controls auto-hide regression test</title>
<style>
  .player-root { position: relative; height: 90vh; background: #111; }
  video { width: 100%; height: 100%; }
  .bottom-0, .server-panel { position: absolute; inset: auto 20px 10px; }
  .episode-popover { position: absolute; inset: 12% 4% 22%; padding: 16px; background: #444; }
  .episode-row { display: flex; overflow-x: auto; margin: 12px 0 0 70px; width: 320px; gap: 12px; }
  .episode-row [role=button] { flex: 0 0 130px; height: 100px; background: #aaa; }
  .server-panel { bottom: 100px; padding: 20px; background: white; }
  .bottom-0 { display: flex; flex-wrap: wrap; }
  .group\/progress { order: -1; width: 100%; height: 36px; }
  button { width: 80px; height: 36px; }
  #skip { position: absolute; right: 20px; bottom: 90px; width: 110px; }
</style>
<script>history.replaceState(null, '', '/watch/movie/test');</script>
<div class="player-root">
  <video></video>
  <div class="inset-0 bg-gradient-to-b pointer-events-none"></div>
  <div class="bottom-0">
    <button id="play" aria-label="Pause">Play</button>
    <button id="servers" aria-label="Servers">Servers</button>
    <button id="episodes" aria-label="Episodes">Episodes</button>
    <div class="group/progress"><input type="range" aria-label="Seek Video"></div>
  </div>
  <button id="skip" hidden>Skip Recap <span aria-hidden="true">⏭</span></button>
  <div class="top-0"><button id="cast">Cast</button><span id="title">Movie title</span></div>
</div>
<output id="result">Tests pending</output>
<script src="/app/src/main/assets/remote.js"></script>
<script>
  const video = document.querySelector('video');
  const player = video.parentElement;
  const bar = document.querySelector('.bottom-0');
  const remote = window.cineJoyTvRemote;
  const focused = () => document.querySelector('[data-cinejoy-tv-focus]');
  const visible = element => getComputedStyle(element).visibility === 'visible';
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  let paused = true;
  const commands = [];
  window.cineJoyTvMedia = {command: action => commands.push(action)};
  Object.defineProperty(video, 'paused', {get: () => paused});

  function playback(isPaused) {
    paused = isPaused;
    video.dispatchEvent(new Event(isPaused ? 'pause' : 'play'));
  }

  document.getElementById('servers').onclick = () => {
    const panel = document.createElement('div');
    panel.className = 'server-panel';
    panel.innerHTML = '<button aria-label="Close">Close</button><button>Server 1</button>';
    panel.firstChild.onclick = () => panel.remove();
    player.appendChild(panel);
  };

  const skip = document.getElementById('skip');
  let skipped = 0;
  skip.onclick = () => {
    skipped++;
    skip.hidden = true;
  };

  let selectedEpisode;
  document.getElementById('episodes').onclick = () => {
    const openPanel = player.querySelector('.episode-popover');
    if (openPanel) {
      openPanel.remove();
      return;
    }
    const panel = document.createElement('div');
    panel.className = 'episode-popover';
    panel.setAttribute('role', 'dialog');

    function showEpisodes() {
      panel.innerHTML = `
        <button aria-label="Change season">Season 1</button>
        <div class="episode-row">
          <div role="button" aria-label="Play episode 1" aria-disabled="true">Now playing</div>
          <div role="button" aria-label="Play episode 2">Episode 2</div>
          <div role="button" aria-label="Play episode 3">Episode 3</div>
          <div role="button" aria-label="Play episode 4">Episode 4</div>
        </div>`;
      panel.firstElementChild.onclick = () => {
        panel.innerHTML = '<button aria-label="Back to episodes">Back</button><button>Season 2</button>';
        panel.firstElementChild.onclick = showEpisodes;
      };
      panel.querySelector('.episode-row').onclick = event => {
        selectedEpisode = event.target.getAttribute('aria-label');
      };
    }

    showEpisodes();
    setTimeout(() => player.appendChild(panel), 220);
  };

  function pressSelect() {
    const point = remote.select();
    check(point && !point.playback, 'Select should target the focused button');
    document.elementFromPoint(point.x * innerWidth, point.y * innerHeight).click();
  }

  function focusedLabel() {
    return focused()?.getAttribute('aria-label');
  }

  function check(condition, message) {
    if (!condition) throw new Error(message);
  }

  async function run() {
    playback(false);
    await wait(4250);
    check(!visible(bar) && visible(video), 'Idle playback should hide the bar and keep video visible');
    remote.move('right', 0);
    check(visible(bar) && commands.join() === 'forward', 'Right should reveal the bar and skip forward');
    remote.move('down', 0);
    remote.move('up', 0);
    check(focused()?.classList.contains('group/progress'), 'Timeline should receive focus');
    await wait(4250);
    check(!visible(bar) && !focused(), 'Timeline focus should clear when playback goes idle');
    playback(true);
    remote.move('down', 0);
    remote.move('up', 0);
    await wait(4250);
    check(visible(bar) && focused()?.classList.contains('group/progress'), 'Pause should keep the focused timeline visible');
    remote.move('up', 0);
    check(!visible(bar) && !focused() && paused, 'Up from the paused timeline should dismiss the controls immediately');
    check(!visible(document.getElementById('cast')) && visible(document.getElementById('title')),
      'Dismissing the controls should hide player buttons and keep the title visible');
    remote.move('up', 2);
    check(!visible(bar), 'Holding Up should keep the controls hidden');
    remote.move('down', 0);
    check(visible(bar), 'Down should reveal the controls again');
    remote.move('up', 0);
    check(focused()?.classList.contains('group/progress'), 'Timeline should remain reachable after dismissing the controls');
    const timeline = focused();
    skip.hidden = false;
    remote.move('up', 0);
    check(focused() === skip && visible(bar), 'Up from the timeline should focus the visible Skip Recap button');
    remote.move('down', 0);
    check(focused() === timeline, 'Down from Skip Recap should return to the timeline');
    check(remote.select()?.playback && focused() === timeline, 'Select should request resume and keep timeline focus');
    playback(false);
    check(remote.select()?.playback && focused() === timeline, 'Select should request pause and keep timeline focus');
    playback(true);
    remote.move('up', 0);
    pressSelect();
    check(skipped === 1 && skip.hidden && paused, 'Select on Skip Recap should click it without toggling playback');
    skip.textContent = 'Skip Intro';
    skip.hidden = false;
    remote.clear();
    remote.move('down', 0);
    remote.move('up', 0);
    check(focused() === timeline, 'Timeline should be reachable after the skip button is activated');
    remote.move('up', 0);
    check(focused() === skip, 'Up should also focus Skip Intro when it is visible');
    remote.move('down', 0);
    skip.hidden = true;
    playback(false);
    await wait(4250);
    check(!visible(bar), 'Resuming with the timeline focused should restart auto-hide');
    remote.move('down', 0);
    remote.move('up', 0);
    remote.move('up', 0);
    check(!visible(bar) && !paused, 'Up from the playing timeline should dismiss the controls immediately');
    remote.playerOption('Servers');
    await wait(4250);
    check(visible(bar) && document.querySelector('.server-panel'), 'An open server menu should stay visible');
    check(remote.back(), 'Back should close the server menu');
    await wait(4250);
    check(!document.querySelector('.server-panel') && !visible(bar), 'The bar should hide after the menu closes');
    const commandsBeforePicker = commands.length;
    remote.playerOption('Episodes');
    await wait(450);
    check(focusedLabel() === 'Change season', 'The season selector should receive focus when the picker opens');
    remote.move('down', 0);
    check(focusedLabel() === 'Play episode 2', 'Down should skip the disabled current episode');
    remote.move('right', 0);
    remote.move('right', 0);
    check(focusedLabel() === 'Play episode 4' && document.querySelector('.episode-row').scrollLeft > 0,
      'Right should reveal and focus clipped episodes');
    pressSelect();
    check(selectedEpisode === 'Play episode 4', 'Select should activate the focused episode');
    remote.move('up', 0);
    check(focusedLabel() === 'Change season', 'Up should return to the season selector');
    pressSelect();
    check(remote.back(), 'Back should return from seasons to episodes');
    await wait(250);
    check(focusedLabel() === 'Change season', 'Back should restore focus to the season selector');
    await wait(4250);
    check(visible(bar) && commands.length === commandsBeforePicker,
      'The open picker should prevent auto-hide and keep Left and Right from seeking');
    check(remote.back() && !document.querySelector('.episode-popover') && focusedLabel() === 'Episodes',
      'Back should close the episode picker and restore focus to its button');
    document.getElementById('result').textContent = 'PASS player controls and episode picker';
  }

  run().catch(error => { document.getElementById('result').textContent = 'FAIL ' + error.message; });
</script>
